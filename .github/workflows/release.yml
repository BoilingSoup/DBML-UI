# Release builds for all three desktop OSes, attached to a GitHub Release.
#
# Triggered by version tags (v*). Each target bundles its platform's
# distribution format around the release binary:
# - Linux:   tar.gz (binary, .desktop launcher, icons), .deb, AppImage,
#            .flatpak single-file bundle (repackages the tar.gz binary)
# - Windows: zip with the exe (app-icon.ico embedded at build time)
# - macOS:   .app bundle (zipped), ad-hoc signed
#
# The icon PNG set renders from icons/app-icon.svg via the repo's own
# resvg dependency (examples/render-icon.rs) before the target builds.
name: Desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN_NAME: dbml-ui
  APP_NAME: dbml-ui

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bundle: linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundle: windows
          - target: x86_64-apple-darwin
            os: macos-latest
            bundle: macos
          - target: aarch64-apple-darwin
            os: macos-latest
            bundle: macos

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # rfd's GTK file dialogs link libgtk-3, and the runner image ships no
      # GTK headers or .so links: every Linux cargo build needs these
      - name: Install GTK3 dev files (Linux)
        if: matrix.bundle == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Render icon PNG set
        run: cargo run --release --example render-icon

      # Linux builds through cargo-zigbuild so the binary targets an OLD
      # glibc: a plain build on the runner inherits ubuntu-24.04's 2.39
      # and refuses to start on Debian 11 (2.31), RHEL 9 (2.34) or Mint
      # 20. Targeting 2.31 covers every still-shipped desktop distro
      # (the GTK stack is linked against the host's stable sonames and
      # needs no zig involvement). Zig comes from the `ziglang` pip
      # package, which cargo-zigbuild finds on PATH.
      - name: Install cargo-zigbuild + zig (Linux)
        if: matrix.bundle == 'linux'
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build release binary (Linux, glibc 2.31 floor)
        if: matrix.bundle == 'linux'
        env:
          # zig's linker doesn't search the multiarch lib dir on its own
          RUSTFLAGS: -L native=/usr/lib/x86_64-linux-gnu
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31

      - name: Build release binary (Windows, static CRT)
        if: matrix.bundle == 'windows'
        env:
          # the MSVC default links the DYNAMIC CRT (VCRUNTIME140.dll),
          # which the exe does not ship — a clean machine can't run it.
          # crt-static embeds the runtime: the portable-single-exe promise
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build release binary
        if: matrix.bundle == 'macos'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle Linux (tar.gz + .deb)
        if: matrix.bundle == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="dbml-ui-${VERSION}-x86_64-linux"
          mkdir -p "dist/$OUT/icons/hicolor/"{16x16,32x32,48x48,128x128,256x256}/apps usr/bin
          cp "target/x86_64-unknown-linux-gnu/release/$BIN_NAME" "dist/$OUT/$BIN_NAME"
          cp icons/app-icon-16.png "dist/$OUT/icons/hicolor/16x16/apps/dbml-ui.png"
          cp icons/app-icon-32.png "dist/$OUT/icons/hicolor/32x32/apps/dbml-ui.png"
          cp icons/app-icon-48.png "dist/$OUT/icons/hicolor/48x48/apps/dbml-ui.png"
          cp icons/app-icon-128.png "dist/$OUT/icons/hicolor/128x128/apps/dbml-ui.png"
          cp icons/app-icon-256.png "dist/$OUT/icons/hicolor/256x256/apps/dbml-ui.png"
          mkdir -p "dist/$OUT/usr/share/icons/hicolor/"{16x16,32x32,48x48,128x128,256x256}/apps
          cp -r "dist/$OUT/icons/hicolor/." "dist/$OUT/usr/share/icons/hicolor/"
          cat > "dist/$OUT/dbml-ui.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=DBML-UI
          Comment=DBML diagram editor
          Exec=dbml-ui
          Icon=dbml-ui
          Categories=Development;Database;
          DESKTOP
          tar -czf "dist/dbml-ui-${VERSION}-x86_64-linux.tar.gz" -C "dist/$OUT" .
          # .deb: the same payload as a package
          mkdir -p "dist/deb/DEBIAN" "dist/deb/usr/bin" "dist/deb/usr/share/applications"
          mkdir -p "dist/deb/usr/share/icons/hicolor/"{16x16,32x32,48x48,128x128,256x256}/apps
          cp "target/x86_64-unknown-linux-gnu/release/$BIN_NAME" "dist/deb/usr/bin/"
          cp "dist/$OUT/dbml-ui.desktop" "dist/deb/usr/share/applications/"
          cp icons/app-icon-16.png "dist/deb/usr/share/icons/hicolor/16x16/apps/dbml-ui.png"
          cp icons/app-icon-32.png "dist/deb/usr/share/icons/hicolor/32x32/apps/dbml-ui.png"
          cp icons/app-icon-48.png "dist/deb/usr/share/icons/hicolor/48x48/apps/dbml-ui.png"
          cp icons/app-icon-128.png "dist/deb/usr/share/icons/hicolor/128x128/apps/dbml-ui.png"
          cp icons/app-icon-256.png "dist/deb/usr/share/icons/hicolor/256x256/apps/dbml-ui.png"
          cat > "dist/deb/DEBIAN/control" <<CONTROL
          Package: dbml-ui
          Version: $VERSION
          Section: devel
          Priority: optional
          Maintainer: BoilingSoup <boilingsoup@protonmail.com>
          Architecture: amd64
          Depends: libgtk-3-0, libxkbcommon0, libx11-6, libwayland-client0
          Description: DBML diagram editor
           Vim-style editing on the left, a live ER diagram on the right.
          CONTROL
          dpkg-deb --build --root-owner-group "dist/deb" "dist/dbml-ui_${VERSION}_amd64.deb"

      # AppImage: the same binary plus everything it loads, assembled in a
      # Debian 11 container (runners have docker). The bundled bullseye
      # libraries set the AppImage's effective glibc floor at the
      # container's 2.31 (they are built against it; libsystemd alone needs
      # GLIBC_2.30), above the bare binary's 2.29. GPU drivers
      # (libGL/libEGL/libvulkan) stay host-provided by design.
      - name: Bundle Linux (AppImage)
        if: matrix.bundle == 'linux'
        run: |
          cat > "$RUNNER_TEMP/appimage.sh" <<'SCRIPT'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive APPIMAGE_EXTRACT_AND_RUN=1
          # Debian 11 is past its LTS: its packages, security updates
          # included, now live on archive.debian.org only
          cat > /etc/apt/sources.list <<'APT'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          deb http://archive.debian.org/debian-security bullseye-security main
          APT
          apt-get -o Acquire::Check-Valid-Until=false update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl file \
            libgtk-3-0 libglib2.0-bin patchelf libx11-xcb1 libxkbcommon-x11-0 \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxfixes3 libxrender1
          T=/tmp/tools
          mkdir -p "$T"
          curl -fsSL -o "$T/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$T/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$T/linuxdeploy" "$T/appimagetool"
          STAGE="dist/dbml-ui-${VERSION}-x86_64-linux"
          A=/tmp/AppDir
          L=$A/usr/lib
          SYS=/usr/lib/x86_64-linux-gnu
          # binary, launcher, icon and the DT_NEEDED closure linuxdeploy
          # takes (it sets the $ORIGIN rpaths)
          "$T/linuxdeploy" --appdir "$A" -e "target/x86_64-unknown-linux-gnu/release/$BIN_NAME" \
            -d "$STAGE/dbml-ui.desktop" -i "$STAGE/icons/hicolor/256x256/apps/dbml-ui.png"
          # linuxdeploy's excludelist leaves the X11/xcb/font stack to the
          # host, which a bare system lacks; winit dlopens libX11-xcb,
          # libxkbcommon-x11 and the x11-dl set (never DT_NEEDED); GTK aborts
          # without a PNG pixbuf loader. Bundle those, then close the set over
          # DT_NEEDED: glibc, zlib, the C++ runtime and the GPU stack stay
          # host-provided.
          bundle() {
            [ -e "$L/$1" ] && return
            cp -L "$(ldconfig -p | awk -v n="$1" '$1 == n && /x86-64/ { print $NF; exit }')" "$L/$1"
          }
          cp -L "$SYS/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-png.so" "$L/"
          for n in libX11-xcb.so.1 libxkbcommon-x11.so.0 libXcursor.so.1 libXrandr.so.2 \
            libXi.so.6 libXinerama.so.1 libXrender.so.1 libXfixes.so.3 libXext.so.6; do
            bundle "$n"
          done
          HOST='^(ld-linux-x86-64|lib(c|dl|m|pthread|resolv|rt|util|z|stdc\+\+|gcc_s)|lib(GL|EGL|GLX|GLdispatch|OpenGL|vulkan|drm|gbm))\.so'
          unbundled() {
            for f in "$A/usr/bin/$BIN_NAME" "$L"/*.so*; do patchelf --print-needed "$f"; done |
              sort -u | { grep -vE "$HOST" || true; } |
              while read -r n; do [ -e "$L/$n" ] || echo "$n"; done
          }
          while :; do
            missing=$(unbundled)
            [ -n "$missing" ] || break
            for n in $missing; do bundle "$n"; done
          done
          for f in "$L"/*.so*; do patchelf --set-rpath '$ORIGIN' "$f"; done
          "$SYS/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders" "$L/libpixbufloader-png.so" |
            sed "s|$L/||" > "$L/loaders.cache"
          # host GPU drivers built against wayland >= 1.20 call
          # wl_proxy_marshal_flags, which bullseye's 1.18 lacks: the bundled
          # copies sit off the rpath, for AppRun to add when the host has none
          mkdir "$L/wayland"
          mv "$L"/libwayland-{client.so.0,cursor.so.0,egl.so.1} "$L/wayland/"
          for f in "$L"/wayland/*; do patchelf --set-rpath '$ORIGIN/..' "$f"; done
          # data the bundled libs look up: GSettings schemas (GTK's file
          # chooser), the mime cache and the XKB root libxkbcommon needs
          mkdir -p "$A/usr/share/glib-2.0/schemas" "$A/usr/share/mime" "$A/usr/share/X11"
          cp /usr/share/glib-2.0/schemas/*.xml "$A/usr/share/glib-2.0/schemas/"
          glib-compile-schemas "$A/usr/share/glib-2.0/schemas"
          find /usr/share/mime -maxdepth 1 -type f -exec cp {} "$A/usr/share/mime/" \;
          cp -a /usr/share/X11/xkb "$A/usr/share/X11/"
          # linuxdeploy's AppRun is a symlink to the binary: replace, don't
          # write through it
          rm -f "$A/AppRun"
          cat > "$A/AppRun" <<'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "${0}")
          HERE=${SELF%/*}
          HOST_LIBS=$(/sbin/ldconfig -p 2>/dev/null)
          # the bundled glib schemas and mime cache (GTK serves the file dialogs)
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          # GTK aborts when it cannot decode its PNG icons, and the bundled
          # gdk-pixbuf's compiled-in loader path is Debian-specific
          export GDK_PIXBUF_MODULE_FILE="$HERE/usr/lib/loaders.cache"
          # libxkbcommon refuses a context without its data root (winit then
          # panics, XKBNotFound): fall back to the bundled copy
          [ -d /usr/share/X11/xkb ] || export XKB_CONFIG_ROOT="${XKB_CONFIG_ROOT:-$HERE/usr/share/X11/xkb}"
          # the bundled wayland 1.18 only when the host lacks one of its libs
          for lib in libwayland-client.so.0 libwayland-cursor.so.0 libwayland-egl.so.1; do
            grep -qF "$lib (libc6,x86-64" <<<"$HOST_LIBS" && continue
            export LD_LIBRARY_PATH="$HERE/usr/lib/wayland${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            break
          done
          # with no Vulkan or EGL loader wgpu panics before iced can fall back
          # to tiny-skia: pick the software renderer up front
          grep -qE 'lib(vulkan|EGL)\.so\.1 \(libc6,x86-64' <<<"$HOST_LIBS" ||
            export ICED_BACKEND="${ICED_BACKEND:-tiny-skia}"
          exec "$HERE/usr/bin/dbml-ui" "$@"
          APPRUN
          chmod 755 "$A/AppRun"
          "$T/appimagetool" --no-appstream "$A" "dist/dbml-ui-${VERSION}-x86_64.AppImage"
          SCRIPT
          docker run --rm -e VERSION="${GITHUB_REF_NAME#v}" -e BIN_NAME \
            -v "$PWD:/repo" -v "$RUNNER_TEMP/appimage.sh:/appimage.sh:ro" -w /repo \
            debian:11 bash /appimage.sh

      - name: Stage Windows exe
        if: matrix.bundle == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force "dist" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/dbml-ui.exe" "dist/dbml-ui-$version-x86_64-windows.exe"

      # the .icns: macOS's own iconutil over an iconset directory — no
      # third-party package, and proper retina variants from the PNG set
      # the macOS equivalent of the VCRUNTIME failure: a third-party
      # dylib the target machine doesn't have. Everything linked must be
      # OS-provided — the audit is a hard gate on both darwin jobs.
      - name: Audit macOS dynamic dependencies
        if: matrix.bundle == 'macos'
        run: |
          BIN="target/${{ matrix.target }}/release/$BIN_NAME"
          otool -L "$BIN" | awk 'NR>1 { print $1 }' | sort -u | while read -r lib; do
            case "$lib" in
              /System/Library/*|/usr/lib/*) ;;
              @rpath/*) echo "FAIL: @rpath dependency $lib (the target machine may not resolve it)"; exit 1 ;;
              *) echo "FAIL: non-system dependency $lib"; exit 1 ;;
            esac
          done
          echo "all dependencies are OS-provided"
      # dyld failures exit instantly; a healthy app is still alive when
      # the timeout fires. Diagnostics only: a runner oddity must not
      # block the release.
      - name: Smoke-launch the macOS binary
        if: matrix.bundle == 'macos'
        continue-on-error: true
        run: |
          BIN="target/${{ matrix.target }}/release/$BIN_NAME"
          "$BIN" > /tmp/smoke.log 2>&1 &
          APP=$!
          sleep 5
          if kill -0 $APP 2>/dev/null; then
            echo "launch smoke: alive after 5s — no dyld/loader failure"
            kill $APP
          else
            wait $APP || true
            echo "launch smoke: process exited early — check /tmp/smoke.log"
            cat /tmp/smoke.log
            exit 1
          fi

      - name: Build the .icns (macOS)
        if: matrix.bundle == 'macos'
        run: |
          I="$RUNNER_TEMP/dbml-ui.iconset"
          mkdir "$I"
          cp icons/app-icon-16.png  "$I/icon_16x16.png"
          cp icons/app-icon-32.png  "$I/icon_16x16@2x.png"
          cp icons/app-icon-32.png  "$I/icon_32x32.png"
          cp icons/app-icon-64.png  "$I/icon_32x32@2x.png"
          cp icons/app-icon-128.png "$I/icon_128x128.png"
          cp icons/app-icon-256.png "$I/icon_128x128@2x.png"
          cp icons/app-icon-256.png "$I/icon_256x256.png"
          cp icons/app-icon-512.png "$I/icon_512x512.png"
          iconutil -c icns "$I" -o "$RUNNER_TEMP/dbml-ui.icns"

      - name: Bundle macOS (.app zip)
        if: matrix.bundle == 'macos'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ contains(matrix.target, 'aarch64') && 'aarch64' || 'x86_64' }}"
          OUT="dbml-ui-$VERSION-$ARCH-macos"
          APP="dist/dbml-ui.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$APP/Contents/MacOS/$BIN_NAME"
          cp "$RUNNER_TEMP/dbml-ui.icns" "$APP/Contents/Resources/dbml-ui.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DBML-UI</string>
            <key>CFBundleDisplayName</key><string>DBML-UI</string>
            <key>CFBundleIdentifier</key><string>io.github.dbml-ui</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>$BIN_NAME</string>
            <key>CFBundleIconFile</key><string>dbml-ui.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict>
          </plist>
          PLIST
          # ad-hoc sign: unsigned binaries are killed by Gatekeeper's
          # taskgated even for local runs on arm64
          codesign --force --deep -s - "$APP" || true
          # the signature must be structurally valid — a broken seal is
          # the "damaged and can't be opened" error on user machines
          codesign --verify --deep --strict "$APP"
          ditto -c -k "$APP" "dist/$OUT.app.zip"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/dbml-ui*

  # Flatpak: repackages the Linux job's binary into a single-file bundle
  # (manifest in packaging/flatpak/). The runtime's GNOME stack provides
  # every library the binary links; the manifest's finish-args cover the
  # sandbox settings (GPU, sockets, the FileChooser portal).
  conformance:
    # The parity gates: our engine vs holistics/dbml at the pinned
    # commit — diagnostics, the parsed schema (with token offsets), the
    # differentially-fuzzed corpus, and the Rust suites (robustness
    # fuzzing, formatter model preservation, the sqlite3 oracle).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install sqlite3 and the GTK link deps (rfd gtk3 pulls glib-sys)
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libgtk-3-dev
      - name: Pin and prepare the upstream compiler
        run: sh parity/setup.sh
      - name: Install the driver's node deps
        run: npm ci --prefix parity/driver
      - name: Build the harnesses
        run: |
          cargo build --release --example parity_dump
          cargo build --release --example parity_schema
          cargo build --release --example boa_spike
      - name: Gate — diagnostics
        run: node parity/run.mjs
      - name: Gate — schema output
        run: node parity/run_schema.mjs
      - name: Gate — the embedded engine fidelity (Boa vs the node reference)
        run: |
          python3 -c "import json, os; base = 'parity/corpus/'; files = sorted(base + f for f in os.listdir(base) if f.endswith('.dbml')); json.dump([{'name': f, 'path': f} for f in files], open('/tmp/boa-cases.json', 'w'))"
          ./target/release/examples/boa_spike /tmp/boa-cases.json parity/bundle/dbml-parse.iife.js > /tmp/boa-out.json
          node parity/driver/theirs-dump-many.ts /tmp/boa-cases.json > /tmp/node-out.json
          python3 parity/driver/boa_gate.py /tmp/boa-out.json /tmp/node-out.json
      - name: Gate — differential fuzz (grammar-shaped corpus)
        run: |
          python3 parity/fuzz.py 300
          CORPUS_DIR="$PWD/parity/fuzz" node parity/run.mjs
          CORPUS_DIR="$PWD/parity/fuzz" node parity/run_schema.mjs
      - name: Rust suites (incl. robustness fuzz + formatter property + sqlite oracle)
        run: cargo test --release

  flatpak:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-x86_64-unknown-linux-gnu
          path: dist
      - name: Stage the flatpak payload
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/linux-bundle
          tar -xzf "dist/dbml-ui-${VERSION}-x86_64-linux.tar.gz" -C /tmp/linux-bundle
          mkdir -p packaging/flatpak/bin packaging/flatpak/icons
          cp /tmp/linux-bundle/dbml-ui packaging/flatpak/bin/dbml-ui
          cp icons/app-icon-48.png packaging/flatpak/icons/48x48.png
          cp icons/app-icon-128.png packaging/flatpak/icons/128x128.png
          cp icons/app-icon-256.png packaging/flatpak/icons/256x256.png
      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Install the GNOME runtime and SDK
        run: |
          # user-scoped: the runner user cannot configure the system install
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47
      - name: Build the flatpak bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build \
            packaging/flatpak/io.github.boilingsoup.dbmlui.yml
          flatpak build-bundle flatpak-repo \
            "dist/dbml-ui-${VERSION}-x86_64.flatpak" io.github.boilingsoup.dbmlui
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-flatpak
          path: dist/dbml-ui*

  release:
    needs: [build, flatpak, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Write the release notes
        run: |
          cat > release-notes.md <<NOTES
          ## dbml-ui ${GITHUB_REF_NAME#v}

          Edit DBML on the left, watch the ER diagram render live on the
          right — vim-style editing, table groups, sticky notes, records
          rows. Imports SQL dumps, exports SVG, PNG and SQL DDL.

          ### Downloads
          - **Linux** — tar.gz (portable), .deb, AppImage, .flatpak
          - **Windows** — portable exe
          - **macOS** — .app zip (Apple Silicon + Intel)

          Full history: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/dbml-ui*
