[package]
name = "dbml-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"

# iced 0.13 canvas-text clipping holes (both backends):
# - tiny_skia never clips canvas text at all ("TODO: Honor layering!" —
#   fill_text stamps INFINITY and draw_text ignores the field), so text
#   outside a canvas widget's bounds paints across neighboring panes;
#   the vendored copy stamps the frame's clip into every text item and
#   honors it in the draw path.
# - neither backend clamps a with_clip region to its parent's clip, so
#   a sliver computed past the canvas widget's edge leaks through even
#   with text stamped; both drafts clamp now.
# (iced_wgpu 0.13.5 already stamps the clip in fill_text — it only
# needed the draft clamp.)
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
iced_wgpu = { path = "vendor/iced_wgpu" }

[dependencies]
# measured text widths for the diagram's icon clusters: shape through the
# same stack iced renders with (version pinned to iced's own copy)
cosmic-text = "0.12.1"
anyhow = "1.0.104"
# The popups' text renders through widget paragraphs (PopupTextLayer)
# because canvas geometry text does not render inside `with_layer` layers
# on iced 0.13. `advanced` enables the custom-widget API; `fira-sans`
# embeds the default UI font. The renderer is wgpu (with the tiny-skia
# fallback iced activates when the adapter request fails). The theme is
# hardcoded Dark (theme::app), so auto-detect-theme stays off.
iced = { version = "=0.13.1", default-features = false, features = [
    "advanced",
    "canvas",
    "smol",
    "svg",
    "wgpu",
    "tiny-skia",
    "fira-sans",
] }
# MSRV pins for rustc 1.84: newer releases of these crates require 1.85+.
image = { version = "=0.25.6", default-features = false, features = ["png"] }
regex = "1.13.1"
resvg = { version = "0.45.1", features = ["raster-images", "text"] }
tiny-skia = "0.11.4"
unicode-width = "=0.2.0"
usvg = "0.45.1"

# System-clipboard text (copy/paste) on X11/Wayland/Windows/macOS. Text
# only: no image-data feature. Unreachable clipboards (headless CI, SSH)
# are a handled error, never a panic.
arboard = { version = "3.7", default-features = false }
# Native file dialogs (Save As, exports): GTK on Linux, native
# on Windows/macOS. XDG portal compatibility via the async-xdg
# feature is not needed — the blocking API runs off the UI thread.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# iced's runtime (smol feature); also hands the file-picker thread's result
# back to the update loop
smol = "2"
# iced/wgpu boot diagnostics route through the `log` crate; DBML_UI_LOG=1
# prints them (which renderer activated, why the GPU path fell back)
log = "0.4"

[build-dependencies]
# embeds icons/app-icon.ico into the exe (build.rs gates on the target —
# winresource only compiles for windows hosts' cross builds of it)
winresource = "=0.1.17"

# X11 keymap query for the physical-ctrl bridge (left-ctrl chords under DE
# modifier grabs): already in the tree as winit's X11 backend, so this adds
# no new compilation.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["xkb"] }
# (the same crate raises the rfd save dialogs to the front)

# XTEST injection for the key-replay example (examples/xtest_repro.rs):
# dev-only, so the shipped binary keeps its feature set.
[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest", "xkb"] }

# Per-frame CPU work (lyon tessellation, cosmic-text shaping, glyph atlas
# uploads) shrinks measurably under LTO + one codegen unit.
[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
