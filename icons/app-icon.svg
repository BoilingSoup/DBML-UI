<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3.5 104 104" width="320" height="320" role="img" aria-label="Database connected to three nodes" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="-3.5" width="104" height="104" rx="23" fill="#0f172a"/><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Connector lines -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- cylinder to right trunk -->
    <path d="M58 42 H70"/>
    <!-- trunk with branches to top and middle nodes -->
    <path d="M74 24 H70 V54 H74"/>
    <!-- cylinder straight down to bottom node -->
    <path d="M38 61 V70"/>
    <!-- bottom node to middle node -->
    <path d="M44 76 H80 V60"/>
  </g>

  <!-- Database cylinder -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="38" cy="22" rx="20" ry="7"/>
    <path d="M18 22 V54 C18 58 26 61 38 61 C50 61 58 58 58 54 V22"/>
    <path d="M18 33 C18 37 26 40 38 40 C50 40 58 37 58 33"/>
    <path d="M18 44 C18 48 26 51 38 51 C50 51 58 48 58 44"/>
  </g>

  <!-- Blue square nodes -->
  <g fill="none" stroke="#3b9cff" stroke-width="2.5" stroke-linejoin="round">
    <rect x="74" y="18" width="12" height="12" rx="1"/>
    <rect x="74" y="48" width="12" height="12" rx="1"/>
    <rect x="32" y="70" width="12" height="12" rx="1"/>
  </g>
  <g fill="#3b9cff">
    <rect x="77.5" y="21.5" width="5" height="5"/>
    <rect x="77.5" y="51.5" width="5" height="5"/>
    <rect x="35.5" y="73.5" width="5" height="5"/>
  </g>
</svg>
